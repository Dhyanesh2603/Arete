<html>
<head>

  <!-- Firebase Compat Libraries for Web -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <script>
    // User's Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCD1rcohw9R0oP78Niq7o09XpPO6JI9TU8",
      authDomain: "arete-13874.firebaseapp.com",
      projectId: "arete-13874",
      storageBucket: "arete-13874.firebasestorage.app",
      messagingSenderId: "352583612364",
      appId: "1:352583612364:web:4e173356acf17ec8dd8f69",
      measurementId: "G-SKN4HJVRKK"
    };

    try {
      firebase.initializeApp(firebaseConfig);
    } catch (e) {
      console.warn("Firebase initialization notice:", e);
    }

    // Google Sign-In with popup (prompts user with list of accounts)
    window.firebaseSignInWithGoogle = async function() {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      const result = await firebase.auth().signInWithPopup(provider);
      return {
        uid: result.user.uid,
        displayName: result.user.displayName || "Google User",
        email: result.user.email,
        photoURL: result.user.photoURL || ""
      };
    };

    // Email / Password Sign In
    window.firebaseSignInWithEmail = async function(email, password) {
      const result = await firebase.auth().signInWithEmailAndPassword(email, password);
      return {
        uid: result.user.uid,
        displayName: result.user.displayName || email.split('@')[0],
        email: result.user.email
      };
    };

    // Email / Password Sign Up
    window.firebaseSignUpWithEmail = async function(name, email, password) {
      const result = await firebase.auth().createUserWithEmailAndPassword(email, password);
      if (name && result.user.updateProfile) {
        await result.user.updateProfile({ displayName: name });
      }
      return {
        uid: result.user.uid,
        displayName: name || result.user.displayName || email.split('@')[0],
        email: result.user.email
      };
    };

    // Sign Out
    window.firebaseSignOut = async function() {
      await firebase.auth().signOut();
    };

    // Get Active User
    window.firebaseGetCurrentUser = function() {
      const user = firebase.auth().currentUser;
      if (!user) return null;
      return {
        uid: user.uid,
        displayName: user.displayName || user.email.split('@')[0],
        email: user.email
      };
    };

    // Procedural Web Audio Soundscape Engine
    (function() {
      let audioCtx = null;
      let currentNodes = [];
      let masterGain = null;
      let currentVolume = 0.5;

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
          masterGain = audioCtx.createGain();
          masterGain.gain.setValueAtTime(currentVolume, audioCtx.currentTime);
          masterGain.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function stopNodes() {
        currentNodes.forEach(function(node) {
          try {
            if (node.stop) node.stop();
            if (node.disconnect) node.disconnect();
          } catch(e) {}
        });
        currentNodes = [];
      }

      window.soundscapePlay = function(preset) {
        stopNodes();
        if (!preset || preset === 'silent') return;

        const ctx = getAudioContext();

        if (preset === 'binaural40Hz') {
          // 40Hz Gamma Differential (200Hz left ear, 240Hz right ear)
          const oscL = ctx.createOscillator();
          const oscR = ctx.createOscillator();
          const merger = ctx.createChannelMerger(2);

          oscL.type = 'sine';
          oscL.frequency.setValueAtTime(200, ctx.currentTime);
          oscR.type = 'sine';
          oscR.frequency.setValueAtTime(240, ctx.currentTime);

          oscL.connect(merger, 0, 0);
          oscR.connect(merger, 0, 1);
          merger.connect(masterGain);

          oscL.start();
          oscR.start();
          currentNodes.push(oscL, oscR, merger);
        } else if (preset === 'brownNoise') {
          // Procedural Brown Noise generator
          const bufferSize = ctx.sampleRate * 2;
          const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          let lastOut = 0.0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            output[i] = (lastOut + (0.02 * white)) / 1.02;
            lastOut = output[i];
            output[i] *= 3.5;
          }
          const source = ctx.createBufferSource();
          source.buffer = noiseBuffer;
          source.loop = true;

          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(350, ctx.currentTime);

          source.connect(filter);
          filter.connect(masterGain);
          source.start();
          currentNodes.push(source, filter);
        } else if (preset === 'terminalHum') {
          // 60Hz transformer drone with soft harmonic
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const filter = ctx.createBiquadFilter();

          osc1.type = 'sawtooth';
          osc1.frequency.setValueAtTime(60, ctx.currentTime);
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(120, ctx.currentTime);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(150, ctx.currentTime);

          const humGain = ctx.createGain();
          humGain.gain.setValueAtTime(0.2, ctx.currentTime);

          osc1.connect(filter);
          osc2.connect(filter);
          filter.connect(humGain);
          humGain.connect(masterGain);

          osc1.start();
          osc2.start();
          currentNodes.push(osc1, osc2, filter, humGain);
        } else if (preset === 'obsidianRain') {
          // Atmospheric rain wash
          const bufferSize = ctx.sampleRate * 2;
          const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            b3 = 0.86650 * b3 + white * 0.3104856;
            b4 = 0.55000 * b4 + white * 0.5329522;
            b5 = -0.7616 * b5 - white * 0.0168980;
            output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
            b6 = white * 0.115926;
          }
          const source = ctx.createBufferSource();
          source.buffer = noiseBuffer;
          source.loop = true;

          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(900, ctx.currentTime);
          filter.Q.setValueAtTime(0.7, ctx.currentTime);

          source.connect(filter);
          filter.connect(masterGain);
          source.start();
          currentNodes.push(source, filter);
        }
      };

      window.soundscapeStop = function() {
        stopNodes();
      };

      window.soundscapeSetVolume = function(val) {
        currentVolume = Math.max(0, Math.min(1, val));
        if (masterGain && audioCtx) {
          masterGain.gain.setValueAtTime(currentVolume, audioCtx.currentTime);
        }
      };
    })();
  </script>
</head>
